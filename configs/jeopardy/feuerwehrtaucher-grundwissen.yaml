title: "Feuerwehrtaucher – Grundwissen"
description: "6 Kategorien rund um das Feuerwehrtauchen nach FwDV 8 (je 7 Fragen)"

categories:

  - name: "Tauchphysik"
    questions:
      - question: "Welcher Absolutdruck herrscht in 10 m Wassertiefe?"
        answer: "2 bar absolut (1 bar Luftdruck + 1 bar Wassersäule)"
      - question: "Wie hoch ist der Sauerstoffanteil normaler Atemluft etwa?"
        answer: "Etwa 21 %"
      - question: "Welche Farbe verschwindet beim Abtauchen als erste?"
        answer: "Rot (langwelliges Licht wird zuerst absorbiert)"
      - question: "Welches Gesetz beschreibt die Beziehung zwischen Druck und Volumen eines Gases bei gleichbleibender Temperatur?"
        answer: "Gesetz von Boyle-Mariotte"
      - question: "Wie hoch ist die Wärmeleitfähigkeit von Wasser im Vergleich zu Luft?"
        answer: "Ca. 25-fach höher"
      - question: "Was passiert am Ventil einer Tauchflasche, wenn sie schnell geöffnet wird?"
        answer: "Das Ventil wird kalt (Joule-Thomson-Effekt: schnelle Gasausdehnung kühlt ab)"
      - question: "Wie hoch ist der Sauerstoff-Partialdruck (ppO₂) bei 30 m Tiefe mit Atemluft (21 % O₂)?"
        answer: "0,84 bar (Absolutdruck 4 bar × 0,21 = 0,84 bar)"

  - name: "Gasplanung & Berechnungen"
    questions:
      - question: "Was besagt die Drittelregel (Rule of Thirds) beim Atemgasmanagement?"
        answer: "Je 1/3 des Atemgases für Hinweg, Rückweg und Notfallreserve"
      - question: "Wie hoch ist das Atemminutenvolumen (AMV) bei Ruhe?"
        answer: "Ca. 15–20 L/min"
      - question: "Wie hoch ist das Atemminutenvolumen (AMV) bei mittlerer körperlicher Arbeit?"
        answer: "Ca. 25–40 L/min"
      - question: "Was berücksichtigt das Mindestatemgas (Turn Pressure) beim Feuerwehrtauchen?"
        answer: "2 Minuten am tiefsten Punkt zur Problembewältigung plus Aufstieg für beide Taucher"
      - question: "Ab welchem Restdruck in der Tauchflasche muss spätestens aufgetaucht werden?"
        answer: "Wenn das Mindestatemgas (Turn Pressure) erreicht ist – nie unter 50 bar"
      - question: "Welcher Zeitraum gilt nach FwDV 8 als Wiederholungstauchgang?"
        answer: "Zwei Tauchgänge innerhalb von 12 Stunden"
      - question: "Welches Leinenzugzeichen gibt der Signalmann für 'Leine nachgeben / nach links'?"
        answer: "2× (zweimal) gemäß FwDV 8 Anlage 2"

  - name: "Tauchkrankheiten & Notfälle"
    questions:
      - question: "Welches Organ erfordert beim Abtauchen besonders frühzeitigen Druckausgleich?"
        answer: "Das Mittelohr"
      - question: "Mit welchem Manöver wird der Druckausgleich im Mittelohr durchgeführt?"
        answer: "Valsalva-/Frenzel-Manöver"
      - question: "Was ist die definitive Behandlung einer Dekompressionskrankheit (DCS)?"
        answer: "Druckkammerbehandlung (Rekompression mit hyperbarem Sauerstoff)"
      - question: "Was bezeichnet die 'Nullzeit' beim Tauchen?"
        answer: "Die maximale Tauchzeit ohne erforderliche Dekompressionspausen"
      - question: "Was ist die richtige erste Maßnahme bei Anzeichen einer Stickstoffnarkose?"
        answer: "Kontrolliert auftauchen – die Symptome verschwinden beim Aufsteigen sofort"
      - question: "Welches Kürzel fasst die Symptome einer Sauerstoffvergiftung zusammen?"
        answer: "VENTID (Visual, Ears, Nausea, Twitching, Irritability, Dizziness)"
      - question: "Welches Gas wird bei einem Tauchunfall als Erste-Hilfe-Maßnahme verabreicht?"
        answer: "Möglichst 100 % Sauerstoff (normobar)"

  - name: "Gerätekunde & Ausrüstung"
    questions:
      - question: "Was ist der wesentliche Unterschied zwischen Trockentauchanzug und Nassanzug?"
        answer: "Der Trockentauchanzug schließt den Körper wasserdicht ein – kein Wassereintritt"
      - question: "Welchen Vorteil bietet eine Vollmaske gegenüber einem Atemregler mit Mundstück?"
        answer: "Kommunikation ist möglich; Gesicht und Atemwege sind vollständig geschützt"
      - question: "Was zeigt der rote Bereich einer Flaschendruckanzeige typischerweise an?"
        answer: "Flasche nahezu leer – Auftauchreserve (ca. 50 bar)"
      - question: "Nach welcher Norm sind autonome Leichttauchgeräte der Feuerwehr zugelassen?"
        answer: "DIN EN 250"
      - question: "In welchem Abstand sind Tauch- und Rettungsgeräte einer Werkstattprüfung zu unterziehen?"
        answer: "Halbjährlich (innerhalb von 6 Monaten)"
      - question: "Welche Farbe kennzeichnet Sauerstoffflaschen nach DIN?"
        answer: "Weiß"
      - question: "Was bezeichnet 'neutrales Tarieren' beim Tauchen?"
        answer: "Der Taucher ist schwebend weder auf- noch abtriebig – er verbleibt in gewünschter Tiefe"

  - name: "Einsatzlehre & Suche"
    questions:
      - question: "Was bedeutet ein einmaliger Leinenzug (1×) vom Taucher zum Signalmann?"
        answer: "Notsignal"
      - question: "Welches Leinenzugzeichen bedeutet 'Alles in Ordnung'?"
        answer: "5× (fünfmal)"
      - question: "Welche Aufgabe hat der Sicherheitstaucher?"
        answer: "Sofortiger Einsatz zur Bergung des verunfallten Tauchers"
      - question: "Welche maximale Auftauchgeschwindigkeit ist ohne Tauchcomputervorgabe zulässig?"
        answer: "10 m/min"
      - question: "Welche Suchform wird bei begrenzter Sicht und unbekanntem Einsatzort typischerweise angewendet?"
        answer: "Leinensuche (Pendelsuche)"
      - question: "Was ist die Jackstay-Suche?"
        answer: "Systematische Flächensuche mit ausgelegter Grundleine, entlang derer der Taucher abtastet"
      - question: "Welche Telefonnummer ist bei einem Tauchunfall in Deutschland zuerst zu wählen?"
        answer: "112 (Rettungsdienst)"

  - name: "FwDV 8 & Recht"
    questions:
      - question: "Welche maximale Tauchtiefe gilt im Regelfall für den Feuerwehrtaucher Stufe 1?"
        answer: "10 m"
      - question: "Aus welchen Personen besteht ein Tauchtrupp nach FwDV 8?"
        answer: "Taucher, Sicherheitstaucher und Signalmann"
      - question: "Welche arbeitsmedizinische Vorsorgeuntersuchung ist für die Tauchtauglichkeit maßgeblich?"
        answer: "G31 (Überdruck)"
      - question: "Wie viele Ausbildungstauchgänge sind für den Feuerwehrtaucher Stufe 1 mindestens abzuleisten?"
        answer: "25 Tauchgänge"
      - question: "Wie alt darf das Rettungsschwimmabzeichen (DRSA Silber) bei Abschluss der Tauchausbildung höchstens sein?"
        answer: "2 Jahre"
      - question: "Wie lange müssen Tauchbücher nach FwDV 8 aufbewahrt werden?"
        answer: "10 Jahre"
      - question: "In welchem Abstand ist die G31-Nachuntersuchung für aktive Feuerwehrtaucher vorgeschrieben?"
        answer: "Jährlich (bis 50 Jahre), danach alle 6 Monate"
