# --- Frage 7: Für 4.000 € (mittel) ---
- question: "Was ist die richtige erste Maßnahme bei Anzeichen einer Stickstoffnarkose (Tiefenrausch)?"
  answers:
  - "Sauerstoff aus der Flasche einatmen"                           # A
  - "An der Tauchstelle verbleiben und abwarten"                    # B
  - "Kontrolliert auftauchen – Symptome verschwinden sofort"        # C
  - "Den Signalmann per Leinenzug alarmieren und bleiben"          # D
  correct: 2
  jokers:
    audience: [7, 6, 77, 10]
    phone: "Auftauchen – die Symptome verschwinden beim Aufsteigen sofort. Antwort C."
    additional: "Antwort C – auftauchen. Kein Medikament, keine Wartezeit."

# --- Frage 8: Für 8.000 € (mittel) ---
- question: "Wie hoch ist das Atemminutenvolumen (AMV) bei mittlerer körperlicher Arbeit unter Wasser etwa?"
  answers:
