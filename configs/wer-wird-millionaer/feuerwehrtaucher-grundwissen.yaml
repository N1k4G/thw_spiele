title: "Feuerwehrtaucher – Grundwissen"
description: "15 Fragen zu Tauchphysik, Medizin, Einsatzlehre, Geräten und Vorschriften nach FwDV 8"

questions:

# --- Frage 1: Für 100 € (sehr leicht) ---
- question: "Welche maximale Tauchtiefe gilt im Regelfall für den Feuerwehrtaucher Stufe 1?"
  answers:
  - "5 m"   # A
  - "10 m"  # B
  - "20 m"  # C
  - "30 m"  # D
  correct: 1
  jokers:
    audience: [6, 78, 11, 5]
    phone: "Das ist 10 m – Stufe 1 ist nach FwDV 8 auf 10 m begrenzt. Antwort B!"
    additional: "10 m, Antwort B. Stufe 2 darf bis 20 m."

# --- Frage 2: Für 200 € (sehr leicht) ---
- question: "Was bedeutet ein einmaliger Leinenzug (1×) vom Taucher zum Signalmann?"
  answers:
  - "Alles in Ordnung" # A
  - "Notsignal"        # B
  - "Nach links"       # C
  - "Austauchen"       # D
  correct: 1
  jokers:
    audience: [5, 82, 7, 6]
    phone: "1× ist das Notsignal – Antwort B. Merkhilfe: einmal = Hilfe!"
    additional: "Notsignal, Antwort B."

# --- Frage 3: Für 300 € (leicht) ---
- question: "Was besagt die Drittelregel (Rule of Thirds) beim Atemgasmanagement?"
  answers:
  - "1/3 Reserve, 2/3 für den gesamten Tauchgang"                # A
  - "Je 1/3 für Hinweg, Rückweg und Notfallreserve"              # B
  - "Mindestens 1/3 des Startdrucks beim Auftauchen behalten"    # C
  - "Drei Druckkontrollpunkte beim Abstieg"                      # D
  correct: 1
  jokers:
    audience: [8, 74, 12, 6]
    phone: "Je 1/3 für Hinweg, Rückweg und Notfallreserve – Antwort B. Das Grundprinzip der Gasplanung."
    additional: "Antwort B – Hinweg, Rückweg, Reserve."

# --- Frage 4: Für 500 € (leicht) ---
- question: "Was passiert am Ventil einer Tauchflasche, wenn sie schnell geöffnet wird (Joule-Thomson-Effekt)?"
  answers:
  - "Das Ventil wird warm"   # A
  - "Das Ventil wird kalt"   # B
  - "Der Druck steigt kurz"  # C
  - "Die Flasche leckt"      # D
  correct: 1
  jokers:
    audience: [11, 76, 8, 5]
    phone: "Das Ventil wird kalt – bei schneller Gasausdehnung kühlt das Gas ab. Antwort B."
    additional: "Kalt, Antwort B – Joule-Thomson-Effekt: Expansion kühlt."

